            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo ""
            echo "[1/4] Stopping old stack..."
            sudo docker compose down --remove-orphans 2>/dev/null || true

            echo ""
            echo "[2/4] Pulling image from ACR..."
            sudo docker compose pull

            echo ""
            echo "[3/4] Starting services..."
            sudo docker compose up -d --no-build --force-recreate

            echo ""
            echo "[4/4] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/" || echo 000)
                if echo "$CODE" | grep -qE '^(200|301|302|307)$'; then
                  HEALTHY=true
                  echo "✅ tokease-token-factory-docs 运行正常 HTTP ${CODE} (第 ${i} 次检查)"
                  break
                fi
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
