                if echo "$CODE" | grep -qE '^(200|301|302|307)$'; then
                  HEALTHY=true
                  echo "✅ token-factory-docs 运行正常 HTTP ${CODE} (第 ${i} 次检查)"
                  break
                fi
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

