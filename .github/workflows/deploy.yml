name: Deploy Docs to Servers

# ============================================================================
# Token Factory Docs — SSH 远程部署工作流
#
# 前提: 先手动运行 "Docker build and push" 构建并推送镜像（GHCR + ACR）
#
# 镜像源:
#   服务器 A → ghcr.io/fyinfor/token-factory-docs:<tag>
#   服务器 B → crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com/fyinfor123/token-factory-docs:<tag>
#
# 部署目标 (两台服务器 × 多实例 = 5 个部署):
#   服务器 A (43.132.223.112):
#     ├─ /home/ubuntu/tokease-factory-docs
#     └─ /home/ubuntu/token-factory-docs
#   服务器 B (43.138.142.105):
#     ├─ /home/ubuntu/tokease-token-factory-docs
#     ├─ /home/ubuntu/token-factory-docs
#     └─ /home/ubuntu/token-factory-docs-123-tok
#
# Server A: GHCR pull → up → 健康检查 → 清理
# Server B: ACR login → pull → up → 健康检查 → 清理
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签 (latest / sha-xxx / 自定义版本)'
        required: true
        default: 'latest'
        type: string

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_GHCR: fyinfor/token-factory-docs
  REGISTRY_ACR: crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME_ACR: fyinfor123/token-factory-docs
  # tokease 实例宿主机端口 3021；token-factory 3001；123-tok 3005

jobs:
  deploy-server-a:
    name: Deploy → 43.132.223.112
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy tokease-factory-docs (43.132.223.112)
        uses: appleboy/ssh-action@v1
        with:
          host: 43.132.223.112
          port: 22
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/tokease-factory-docs"
            PORT="3021"

            echo "========================================="
            echo "  服务器: 43.132.223.112"
            echo "  实例:   tokease-factory-docs"
            echo "  镜像:   $IMAGE"
            echo "  时间:   $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo ""
            echo "[1/4] Stopping old stack..."
            sudo docker compose down --remove-orphans 2>/dev/null || true

            echo ""
            echo "[2/4] Pulling image..."
            sudo docker compose pull

            echo ""
            echo "[3/4] Starting services..."
            sudo docker compose up -d --no-build --force-recreate

            echo ""
            echo "[4/4] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/" || echo 000)
                if echo "$CODE" | grep -qE '^(200|301|302|307)$'; then
                  HEALTHY=true
                  echo "✅ tokease-factory-docs 运行正常 HTTP ${CODE} (第 ${i} 次检查)"
                  break
                fi
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Deploy token-factory-docs (43.132.223.112)
        uses: appleboy/ssh-action@v1
        with:
          host: 43.132.223.112
          port: 22
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/token-factory-docs"
            PORT="3001"

            echo "========================================="
            echo "  服务器: 43.132.223.112"
            echo "  实例:   token-factory-docs"
            echo "  镜像:   $IMAGE"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo "[1/4] Stopping old stack..."
            sudo docker compose down --remove-orphans 2>/dev/null || true

            echo "[2/4] Pulling image..."
            sudo docker compose pull

            echo "[3/4] Starting services..."
            sudo docker compose up -d --no-build --force-recreate

            echo "[4/4] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/" || echo 000)
                if echo "$CODE" | grep -qE '^(200|301|302|307)$'; then
                  HEALTHY=true
                  echo "✅ token-factory-docs 运行正常 HTTP ${CODE} (第 ${i} 次检查)"
                  break
                fi
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Cleanup old images (43.132.223.112)
        uses: appleboy/ssh-action@v1
        with:
          host: 43.132.223.112
          port: 22
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            echo ">>> Cleaning up dangling images..."
            sudo docker image prune -f || true
            echo "✅ Cleanup done"

      - name: Summary (Server A)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="$([ "$STATUS" = "success" ] && echo '✅' || echo '❌')"
          {
            echo "### ${ICON} Server A (43.132.223.112) — ${STATUS}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 镜像 | \`${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}:${{ inputs.tag }}\` |"
            echo "| 实例1 | tokease-factory-docs |"
            echo "| 实例2 | token-factory-docs |"
          } >> $GITHUB_STEP_SUMMARY

  deploy-server-b:
    name: Deploy → 43.138.142.105
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Login to ACR (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: 43.138.142.105
          port: 22
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            set -e
            echo "${{ secrets.ACR_ALLINONE_PASSWORD }}" | sudo docker login \
              ${{ env.REGISTRY_ACR }} \
              -u "${{ secrets.ACR_ALLINONE_USERNAME }}" \
              --password-stdin
            echo "✅ ACR login success"

      - name: Deploy tokease-token-factory-docs (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: 43.138.142.105
          port: 22
          username: ubuntu
