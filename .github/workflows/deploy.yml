              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Deploy token-factory-docs-123-tok (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: 43.138.142.105
