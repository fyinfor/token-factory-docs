name: Docker build and push

# 手动触发：构建 token-factory-docs 镜像，双推 GHCR + 阿里云 ACR
# ACR Secrets: ACR_ALLINONE_USERNAME / ACR_ALLINONE_PASSWORD（与 token-factory 相同）
# 拉取示例：
#   GHCR: docker pull ghcr.io/fyinfor/token-factory-docs:latest
#   ACR:  docker pull crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com/fyinfor123/token-factory-docs:latest

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: 'main'
        type: string
      extra_tag:
        description: 'Optional extra image tag (e.g. release version)'
        required: false
        default: ''
        type: string
      push_acr:
        description: '推送到阿里云 ACR（国内服务器 43.138.142.105 拉取用）'
        type: boolean
        default: true

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_GHCR: fyinfor/token-factory-docs
  REGISTRY_ACR: crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME_ACR: fyinfor123/token-factory-docs

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查 ACR Secrets
        if: github.event.inputs.push_acr == 'true'
        env:
          ACR_USER: ${{ secrets.ACR_ALLINONE_USERNAME }}
          ACR_PASS: ${{ secrets.ACR_ALLINONE_PASSWORD }}
        run: |
          if [ -z "$ACR_USER" ] || [ -z "$ACR_PASS" ]; then
            echo "::error::未配置 ACR_ALLINONE_USERNAME / ACR_ALLINONE_PASSWORD。请到 token-factory-docs → Settings → Secrets 添加（值与 token-factory 相同），或取消勾选「推送到阿里云 ACR」。"
            exit 1
          fi

      - name: Log in to Alibaba Cloud ACR
        if: github.event.inputs.push_acr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_ACR }}
          username: ${{ secrets.ACR_ALLINONE_USERNAME }}
          password: ${{ secrets.ACR_ALLINONE_PASSWORD }}

      - name: Set image targets
        id: image_targets
        run: |
          {
            echo 'images<<EOF'
            echo "${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}"
            if [ "${{ github.event.inputs.push_acr }}" = "true" ]; then
              echo "${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_targets.outputs.images }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event.inputs.extra_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**GHCR pull:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker pull ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.push_acr }}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**ACR pull:**" >> "$GITHUB_STEP_SUMMARY"
            echo "\`docker pull ${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          fi
